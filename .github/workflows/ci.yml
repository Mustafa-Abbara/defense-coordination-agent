# Continuous integration: lint and tests on every push and pull request,
# on Linux and on Windows (the development machine), with Python 3.12.
name: CI

on:
  push:
  pull_request:

# Least privilege: this workflow only needs to read the code.
permissions:
  contents: read

jobs:
  test:
    name: lint + tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false        # show results for both systems even if one fails
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0      # full history: the test "no .env ever committed" needs it

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check .

      - name: Format check
        run: python -m ruff format --check .

      - name: Tests
        run: python -m pytest
