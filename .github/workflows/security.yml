# Security checks (bonus B-2):
#   gitleaks  -> secret scanning of the full git history (threat TH-08, test SEC-10)
#   pip-audit -> known vulnerabilities in installed dependencies (threat TH-12, test SEC-13)
name: Security

on:
  push:
  pull_request:
  schedule:
    - cron: "17 5 * * 1"   # every Monday 05:17 UTC: new vulnerabilities appear without code changes
  workflow_dispatch:        # "Run workflow" button on GitHub

# Least privilege: both jobs only read the code.
permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.30.1"

jobs:
  gitleaks:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0      # scan every commit, not only the latest one

      - name: Install gitleaks (pinned version, checksum verified)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "${base}/${archive}"
          curl -sSfLO "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          # Refuse to run a binary whose hash does not match the published checksum.
          sha256sum --check --ignore-missing "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          tar -xzf "${archive}" gitleaks
          ./gitleaks version

      - name: Scan git history
        # --redact: never print the secret itself in the CI log.
        # --log-opts=HEAD: scan the full history of the commit being tested. Without it,
        #   gitleaks scans every fetched branch, so one bad branch would turn every run red.
        # Exit code 1 (leak found) fails the job. Config: .gitleaks.toml
        run: ./gitleaks git --redact --no-banner --verbose --log-opts="HEAD" .

  pip-audit:
    name: dependency audit (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Audit installed packages
        # --skip-editable: our own package is not on PyPI, so there is nothing to look up.
        # (--strict is not used: it turns that expected skip into an error.)
        # Exit code 1 (vulnerability found) fails the job.
        run: python -m pip_audit --skip-editable
